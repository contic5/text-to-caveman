<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>text-to-caveman</title>
  </head>
  <body>
    <main>
    <h1>Text to Caveman</h1>
    <label for="original">Original</label>
    <textarea id="original">This project converts words from English to caveman</textarea>
    <button id="submit_button" type="button">Submit</button>
    <label for="results">Caveman</label>
    <textarea id="results"></textarea>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script type="module" src="/src/main.js"></script>
    <script type="module">
    import {text_to_caveman} from "/src/main.js";
    document.getElementById("submit_button").onclick=text_to_caveman;
    </script>
  </body>
</html>
